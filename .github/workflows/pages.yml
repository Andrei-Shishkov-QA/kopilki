# Выкладка сайта. Собирает сразу все версии:
#   ветка main  → …/kopilki/          (основная, для всех)
#   ветка beta  → …/kopilki/beta/     (новое, для владельца)
#   ветки release/X.Y.Z → …/kopilki/v/X.Y.Z/  (каждый выпуск навсегда, для отката)
# и файл versions.json со списком выпусков.
name: Тесты и публикация
on:
  push:
    branches: [main, beta, 'release/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Собрать все версии
        run: bash .github/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
