# Публикация сайта — после зелёных тестов любой ветки. Запускается от имени main
# (так GitHub Pages разрешает выкладку) и собирает сразу все версии:
#   ветка main            → …/kopilki/          (основная, для всех)
#   ветка beta            → …/kopilki/beta/     (новое, для владельца)
#   ветки release/X.Y.Z   → …/kopilki/v/X.Y.Z/  (каждый выпуск навсегда, для отката)
# и versions.json со списком выпусков. Сборка — .github/build-site.sh.
name: Публикация
on:
  workflow_run:
    workflows: [Тесты]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Собрать все версии
        run: bash .github/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
