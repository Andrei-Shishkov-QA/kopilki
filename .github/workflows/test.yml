# Тесты на каждый push в main, beta и release/*.
name: Тесты
on:
  push:
    branches: [main, beta, 'release/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
